# #1036 (2026-09-28, David GO): suppress the per-send ant_quic::send_error WARN flood.
# Deployed to /etc/systemd/system/x0xd-443.service.d/20-x0x-1036-rustlog.conf on all 6 prod hosts.
# ant-quic 0.27.54 (x0x#1059) bounds this logging at source; this drop-in stays until
# v0.46.0 is promoted and the fleet shows ~0 send_error lines per 24 h.
[Service]
Environment=RUST_LOG=warn,ant_quic::send_error=error
